# Replaces the nginx:alpine default server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the proxy in front, so absolute redirects would send visitors to http://.
    absolute_redirect off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
